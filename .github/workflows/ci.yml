name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The smoke test starts the built server and drives it over HTTP:
      # pages, the 404 route, the SSRF guard, and a real lead capture.
      - run: npm test
